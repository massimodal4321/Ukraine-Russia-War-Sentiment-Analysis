name: Backfill

on:
  # runs itself once a day so the free-tier quota resets between runs
  schedule:
    - cron: "30 8 * * *"
  workflow_dispatch:
    inputs:
      phase:
        description: "Sampling density"
        required: true
        default: daily
        type: choice
        options: [monthly, 10daily, weekly, every3rd, daily]
      chain:
        description: "Re-trigger itself when the budget runs out"
        required: true
        default: "true"
        type: choice
        options: ["true", "false"]

permissions:
  contents: write
  actions: write

concurrency:
  group: backfill
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -q google-genai google-cloud-bigquery db-dtypes py3langid

      - name: Write service account key
        run: echo '${{ secrets.GCP_SA_KEY }}' > /tmp/sa.json

      - name: Backfill
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          GCP_SA_KEY_FILE: /tmp/sa.json
          PHASE: ${{ inputs.phase || 'daily' }}
          BUDGET_MIN: "320"
          MODEL: "gemini-3.5-flash-lite"
          BATCH: "400"
          REQ_TIMEOUT_S: "240"
          GAP_S: "12"
        run: python scripts/backfill.py

      - name: Commit
        run: |
          git config user.name  "backfill-bot"
          git config user.email "actions@github.com"
          # -A on the directory, not a list of paths. A named path that does not exist
          # makes git add fail and stage NOTHING, which silently threw away a whole
          # run's work: .quota_stopped only exists when a run stops on quota, so any
          # run that stopped on the time budget committed nothing at all.
          git add -A data
          if git diff --staged --quiet; then
            echo "nothing new"
          else
            git commit -m "backfill: ${{ inputs.phase }}"
            git pull --rebase --autostash
            git push
          fi

      - name: Chain another run if work remains
        if: ${{ inputs.chain != 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REMAIN=$(cat data/.remaining 2>/dev/null || echo 0)
          echo "days remaining: $REMAIN"
          if [ -f data/.quota_stopped ]; then
            echo "stopped on daily quota, not chaining. The 06:15 UTC schedule continues tomorrow."
          elif [ "$REMAIN" -gt 0 ]; then
            gh workflow run backfill.yml -f phase="${{ inputs.phase || 'daily' }}" -f chain=true
          else
            echo "phase complete, nothing left"
          fi
