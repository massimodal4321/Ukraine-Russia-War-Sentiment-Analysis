name: Backfill

on:
  # Two triggers, four hours apart. GitHub treats scheduled workflows as best-effort
  # and says outright that they can be delayed under load or dropped, and the top and
  # half of each hour are the most congested slots. One trigger meant a single skip
  # cost a whole day, so there is a second as a fallback.
  #
  # The odd minute avoids the congestion. 09:07 UTC is two hours after the Gemini
  # quota resets at 07:00. If the first is dropped the second picks it up.
  schedule:
    - cron: "7 9 * * *"
    - cron: "7 13 * * *"
  workflow_dispatch:
    inputs:
      phase:
        description: "Sampling density"
        required: true
        default: daily
        type: choice
        options: [monthly, 10daily, weekly, every3rd, daily]
      chain:
        description: "Re-trigger itself when the budget runs out"
        required: true
        default: "true"
        type: choice
        options: ["true", "false"]

permissions:
  contents: write
  actions: write

# A second trigger is only free if it cannot collide with a run already working.
# This makes GitHub refuse to start a new run while one is in flight, so the 13:07
# fallback does nothing at all unless the 09:07 attempt never happened.
concurrency:
  group: backfill
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -q google-genai google-cloud-bigquery db-dtypes py3langid

      - name: Write service account key
        run: echo '${{ secrets.GCP_SA_KEY }}' > /tmp/sa.json

      - name: Backfill
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          GCP_SA_KEY_FILE: /tmp/sa.json
          PHASE: ${{ inputs.phase || 'daily' }}
          BUDGET_MIN: "320"
          MODEL: "gemini-3.5-flash-lite"
          BATCH: "1200"
          REQ_TIMEOUT_S: "420"
          GAP_S: "10"
        run: python scripts/backfill.py

      - name: Commit
        run: |
          git config user.name  "backfill-bot"
          git config user.email "actions@github.com"
          # -A on the directory, not a list of paths. A named path that does not exist
          # makes git add fail and stage NOTHING, which silently threw away a whole
          # run's work: .quota_stopped only exists when a run stops on quota, so any
          # run that stopped on the time budget committed nothing at all.
          git add -A data
          if git diff --staged --quiet; then
            echo "nothing new"
          else
            git commit -m "backfill: ${{ inputs.phase }}"
            git pull --rebase --autostash
            git push
          fi

      - name: Chain another run if work remains
        # success() is explicit: a failed run must never trigger another one.
        if: ${{ success() && inputs.chain != 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REMAIN=$(cat data/.remaining 2>/dev/null || echo 0)
          DID=$(cat data/.progress 2>/dev/null || echo 0)
          echo "dates completed this run: $DID, remaining: $REMAIN"
          # The progress guard is what stops a runaway chain. A run that achieved
          # nothing cannot trigger another, so a fast-failing loop dies after one.
          if [ "$DID" -eq 0 ]; then
            echo "this run completed no dates, so not chaining. Something needs looking at."
          elif [ -f data/.quota_stopped ]; then
            echo "stopped on the daily quota, not chaining. The 08:30 UTC schedule continues tomorrow."
          elif [ "$REMAIN" -gt 0 ]; then
            gh workflow run backfill.yml -f phase="${{ inputs.phase || 'daily' }}" -f chain=true
          else
            echo "phase complete, nothing left"
          fi
